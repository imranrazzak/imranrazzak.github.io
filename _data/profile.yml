short_bio: '<p>I am an Associate Professor of Computational Biology at <a href="https://mbzuai.ac.ae/study/faculty/imran-razzak/">Mohamed
  bin Zayed University of Artificial Intelligence (MBZUAI)</a>, where I lead the GenMI research lab. I am also CEO
  of <a href="https://medos.tech/">MedOS</a>, where we build AI for medicine. Previously, I worked in human-centered
  machine learning at UNSW and computer science at Deakin University.</p>

  <p>My research connects <strong>personalized medicine, medical imaging, and multimodal clinical AI</strong>. I
  develop models that bring together imaging, language, and other biomedical data for clinical reasoning and spatial
  grounding, with an emphasis on robust, trustworthy systems and longitudinal healthcare.</p>

  <p><strong>Open positions:</strong> I welcome prospective PhD students, postdoctoral researchers, visiting students,
  and remote interns interested in medical foundation models and clinical reasoning. Please <a href="/student.html">read
  the application guidance</a> and email your CV and a short research proposal.</p>'
