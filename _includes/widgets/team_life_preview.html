<section class="card border-0 shadow-sm bg-white my-3" aria-labelledby="team-preview-title"><div class="card-body p-4">
<div class="d-flex justify-content-between align-items-baseline mb-3"><h2 class="h5 mb-0" id="team-preview-title">Life in the Group</h2><a class="small" href="{{ '/team.html#team-life' | relative_url }}">Team Life →</a></div>
<div class="row">{% for event in site.data.team_events limit:2 %}<figure class="col-sm-6 mb-2"><a href="{{ '/team.html#team-life' | relative_url }}"><img class="img-fluid rounded" width="1280" height="960" src="{{ event.image | relative_url }}" alt="{{ event.alt | escape }}" loading="lazy"></a><figcaption class="small text-muted mt-2">{{ event.title }}</figcaption></figure>{% endfor %}</div>
</div></section>
