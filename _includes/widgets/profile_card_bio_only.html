<div class="mt-3 d-md-none"></div>
<section class="card border-0 shadow-sm bg-white" aria-labelledby="about-title">
  <div class="card-body p-4">
    <h2 id="about-title" class="h4 mb-3">About Me</h2>
    <div class="text-profile-bio">{{ site.data.profile.short_bio }}</div>
    {% if site.data.profile.cv_link %}<a href="{{ site.data.profile.cv_link | relative_url }}"><i class="fas fa-file-alt" aria-hidden="true"></i> Curriculum Vitae</a>{% endif %}
  </div>
</section>
